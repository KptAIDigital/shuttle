<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ผู้ดูแล – รายชื่อผู้แจ้งใช้รถรับ-ส่ง</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#f1f5f9;font-family:'Sarabun',system-ui,sans-serif;color:#0f172a}
.w{max-width:1100px;margin:0 auto;padding:16px}
h1{font-size:1.3rem;margin:8px 0 16px}
.cards{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.c{background:#fff;border-radius:12px;padding:14px 18px;box-shadow:0 1px 4px #0001;min-width:170px}
.c b{display:block;font-size:1.7rem;color:#0369a1}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
input{flex:1;min-width:200px;padding:10px;border:1.5px solid #cbd5e1;border-radius:10px;font:inherit}
a.b{padding:10px 14px;background:#0369a1;color:#fff;border-radius:10px;text-decoration:none;font-weight:600}
a.b.g{background:#475569}
.t{background:#fff;border-radius:12px;overflow:auto;box-shadow:0 1px 4px #0001}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid #e2e8f0;white-space:nowrap}
td.n{white-space:normal;min-width:160px}
th{background:#f8fafc;position:sticky;top:0}
</style></head><body><div class="w">
<h1>รายชื่อผู้แจ้งความประสงค์ใช้รถรับ-ส่ง</h1>
<div class="cards" id="cards"></div>
<div class="bar">
  <input id="q" placeholder="ค้นหา รหัส / ชื่อ / หน่วยงาน / จุดรับ-ส่ง">
  <a class="b" href="/admin/export.csv">ดาวน์โหลด CSV (คนที่กรอกแล้ว)</a>
  <a class="b g" href="/admin/export.csv?type=pending">CSV คนที่ยังไม่กรอก</a>
</div>
<div class="t"><table><thead><tr><th>#</th><th>รหัส</th><th>ชื่อ-นามสกุล</th><th>หน่วยงาน</th><th>จุดรับ-ส่ง</th><th>เบอร์โทร</th><th>หมายเหตุ</th><th>วันที่ใช้บริการ</th><th>เวลาที่กรอก</th></tr></thead><tbody id="tb"></tbody></table></div>
</div>
<script>
let rows=[];
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=d=>new Date(d).toLocaleString('th-TH',{dateStyle:'short',timeStyle:'short'});
const pk=r=>r.pickup==='อื่น ๆ'?'อื่น ๆ: '+(r.pickup_other||''):r.pickup;
function draw(){
  const q=document.getElementById('q').value.trim().toLowerCase();
  const f=rows.filter(r=>!q||[r.staff_no,r.emp_name,r.org,pk(r),r.phone].join(' ').toLowerCase().includes(q));
  document.getElementById('tb').innerHTML=f.map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r.staff_no)}</td><td class="n">${esc(r.emp_name)}</td><td class="n">${esc(r.org)}</td><td>${esc(pk(r))}</td><td>${esc(r.phone)}</td><td class="n">${esc(r.note)}</td><td>${esc(r.service_date)}</td><td>${fmt(r.updated_at)}</td></tr>`).join('');
}
async function load(){
  const d=await (await fetch('/admin/api/data')).json();
  rows=d.submissions;
  document.getElementById('cards').innerHTML=
    `<div class="c">กรอกแล้ว<b>${rows.length}</b>จาก ${d.totalEmployees} คน</div>`+
    d.summary.map(s=>`<div class="c">${esc(s.pickup)}<b>${s.n}</b>คน</div>`).join('');
  draw();
}
document.getElementById('q').addEventListener('input',draw);
load(); setInterval(load,30000);
</script></body></html>
