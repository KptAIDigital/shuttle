# Render Blueprint (แผนฟรี): Web Service + PostgreSQL
databases:
  - name: shuttle-db
    plan: free               # ฟรี 1 ก้อน/บัญชี, หมดอายุ 30 วันหลังสร้าง -> โหลด CSV เก็บไว้ก่อน
    databaseName: shuttle
    user: shuttle

services:
  - type: web
    name: shuttle-form
    runtime: node
    plan: free               # หลับหลังไม่มีคนใช้ 15 นาที, ปลุกใหม่ใช้เวลา ~1 นาที
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: shuttle-db
          property: connectionString
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASSWORD
        sync: false          # ตั้งเองใน Render Dashboard
